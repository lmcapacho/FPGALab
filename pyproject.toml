[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-lab"
version = "0.1.0rc4"
description = "Interactive virtual laboratory for Verilog designs and FPGA boards"
authors = [
    {name = "Luis Miguel Capacho", email = "lmcapacho@gmail.com"},
]
maintainers = [
    {name = "Luis Miguel Capacho", email = "lmcapacho@gmail.com"},
]
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.5"]

[project.urls]
Homepage = "https://github.com/lmcapacho/FPGALab"
Source = "https://github.com/lmcapacho/FPGALab"
Issues = "https://github.com/lmcapacho/FPGALab/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.scripts]
fpga-lab = "fpga_lab.app:main"

[tool.setuptools.packages.find]
include = ["fpga_lab*"]

[tool.setuptools.package-data]
fpga_lab = [
    "assets/boards/*.svg",
    "assets/board_layouts/*.json",
    "assets/board_definitions/*.json",
    "assets/profiles/*.json",
    "assets/icons/*.svg",
    "assets/icons/*.png",
    "assets/icons/*.ico",
    "assets/icons/ui/*.svg",
    "assets/icons/catalog/*.svg",
    "assets/labs/*.json",
    "locales/*.json",
    "peripherals/*/manifest.json",
    "peripherals/*/*.svg",
    "native/*",
]
