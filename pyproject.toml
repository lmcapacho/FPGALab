[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-lab"
version = "0.1.0"
description = "Interactive virtual laboratory for Verilog designs and FPGA boards"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.5"]

[project.scripts]
fpga-lab = "fpga_lab.app:main"

[tool.setuptools.packages.find]
include = ["fpga_lab*"]

[tool.setuptools.package-data]
fpga_lab = ["assets/boards/*.svg", "assets/board_layouts/*.json"]
