[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-lab"
version = "0.1.0"
description = "Laboratorio virtual interactivo para diseños y placas FPGA"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.5"]

[project.scripts]
fpga-lab = "fpga_lab.app:main"

[tool.setuptools.packages.find]
include = ["fpga_lab*"]
