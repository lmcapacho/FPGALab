name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install -e .
      - name: Build portable application
        run: python -m PyInstaller packaging/pyinstaller/FPGALab.spec --noconfirm --clean
      - name: Create Linux archive
        run: tar -C dist -czf "FPGALab-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" FPGALab
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-release-assets
          path: FPGALab-*-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install -e .
      - name: Build portable application
        shell: powershell
        run: python -m PyInstaller packaging/pyinstaller/FPGALab.spec --noconfirm --clean
      - name: Build self-contained executable
        shell: powershell
        run: python -m PyInstaller packaging/pyinstaller/FPGALab-onefile.spec --noconfirm
      - name: Create Windows release assets
        shell: powershell
        run: |
          Compress-Archive -Path "dist\FPGALab\*" -DestinationPath "FPGALab-${env:GITHUB_REF_NAME}-windows-x64-portable.zip" -Force
          Copy-Item "dist\FPGALab.exe" "FPGALab-${env:GITHUB_REF_NAME}-windows-x64.exe" -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-assets
          path: |
            FPGALab-*-windows-x64-portable.zip
            FPGALab-*-windows-x64.exe

  build-macos:
    name: Build macOS (${{ matrix.asset_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            asset_arch: x86_64
          - runner: macos-15
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install -e .
      - name: Create macOS application icon
        run: |
          iconset="build/fpgalab.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" fpga_lab/assets/icons/fpgalab.png --out "$iconset/icon_${size}x${size}.png"
            double_size=$((size * 2))
            sips -z "$double_size" "$double_size" fpga_lab/assets/icons/fpgalab.png --out "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o fpga_lab/assets/icons/fpgalab.icns
      - name: Build macOS application bundle
        run: python -m PyInstaller packaging/pyinstaller/FPGALab.spec --noconfirm --clean
      - name: Verify and archive macOS application
        run: |
          codesign --force --deep --sign - "dist/FPGALab.app"
          codesign --verify --deep --strict "dist/FPGALab.app"
          version="${GITHUB_REF_NAME//\//-}"
          ditto -c -k --sequesterRsrc --keepParent "dist/FPGALab.app" "FPGALab-${version}-macos-${{ matrix.asset_arch }}.zip"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.asset_arch }}-release-assets
          path: FPGALab-*-macos-${{ matrix.asset_arch }}.zip

  publish-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-release-assets
          path: release-assets
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-release-assets
          path: release-assets
      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-x86_64-release-assets
          path: release-assets
      - name: Download macOS Apple Silicon artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-arm64-release-assets
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          files: release-assets/*
