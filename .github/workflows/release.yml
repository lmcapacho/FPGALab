name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install -e .
      - name: Build portable application
        run: python -m PyInstaller packaging/pyinstaller/FPGALab.spec --noconfirm --clean
      - name: Create Linux archive
        run: tar -C dist -czf "FPGALab-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" FPGALab
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-release-assets
          path: FPGALab-*-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install -e .
      - name: Build portable application
        shell: powershell
        run: python -m PyInstaller packaging/pyinstaller/FPGALab.spec --noconfirm --clean
      - name: Create Windows archive
        shell: powershell
        run: Compress-Archive -Path "dist\FPGALab\*" -DestinationPath "FPGALab-${env:GITHUB_REF_NAME}-windows-x64-portable.zip" -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-assets
          path: FPGALab-*-windows-x64-portable.zip

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-release-assets
          path: release-assets
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-release-assets
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          files: release-assets/*
