name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q fpga_lab
      - name: Verify package metadata
        run: |
          python -c "from importlib.metadata import version; import fpga_lab; assert fpga_lab.__version__ == version('fpga-lab')"
          python -m pip check
