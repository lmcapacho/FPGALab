name: Experimental Linux SDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build frozen SDK and probe in clean offline Ubuntu
        run: python3 packaging/linux_toolchain/container_build.py --output "$RUNNER_TEMP/fpgalab-sdk"
      - name: Upload experimental SDK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: experimental-linux-sdk
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/fpgalab-sdk/fpgalab-linux-sdk.tar.gz
            ${{ runner.temp }}/fpgalab-sdk/fpgalab-linux-sdk.tar.gz.sha256
            ${{ runner.temp }}/fpgalab-sdk/relocated-sdk/toolchain.json
            ${{ runner.temp }}/fpgalab-sdk/relocated-sdk/source-packages.json
            ${{ runner.temp }}/fpgalab-sdk/validation.json
